<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan Objek JavaScript Modern</title>
  <style>
    /* CSS untuk mempercantik tampilan */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input, select, textarea {
      width: 300px;
      max-width: 100%;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Memasukkan Data dengan Objek Teks</h1>

  <!-- FORM INPUT -->
  <form id="dataForm">
    <h3>Input</h3>

    <!-- Input NIK -->
    <label>NIK: <input type="text" id="Nik"></label>

    <!-- Input Nama -->
    <label>Nama: <input type="text" id="Nama"></label>

    <!-- Pilihan Gender -->
    <label>Gender:
      <select id="Gender">
        <option value="Pria">Pria</option>
        <option value="Wanita">Wanita</option>
      </select>
    </label>

    <!-- Pilihan Agama -->
    <label>Agama:
      <select id="Agama">
        <option value="Islam">Islam</option>
        <option value="Kristen">Kristen</option>
        <option value="Hindu">Hindu</option>
        <option value="Buddha">Buddha</option>
      </select>
    </label>

    <!-- Pilihan Status Pernikahan -->
    <label>Status:
      <label><input type="radio" name="status" value="Sudah Nikah"> Sudah Nikah</label>
      <label><input type="radio" name="status" value="Belum Nikah"> Belum Nikah</label>
    </label>

    <!-- Pilihan Jurusan -->
    <label>Jurusan:
      <select id="Jurusan">
        <option>Teknik Informatika</option>
        <option>Manajemen Informatika</option>
        <option>Teknik Komputer</option>
        <option>Teknik Industri</option>
        <option>Teknik Elektro</option>
        <option>Teknik Sipil</option>
        <option>Teknik Arsitektur</option>
        <option>Perencanaan Wil. Kota</option>
      </select>
    </label>

    <!-- Komentar atau keterangan -->
    <label>Komentar:
      <textarea id="Ket" rows="3"></textarea>
    </label>

    <!-- Tombol kirim dan reset -->
    <button type="button" id="kirimBtn">Kirim</button>
    <button type="reset">Ulang</button>
  </form>

  <hr>
  <h3>Output</h3>

  <!-- Bagian untuk menampilkan output hasil input -->
  <div id="output">
    <p><strong>NIK:</strong> <span id="onik"></span></p>
    <p><strong>Nama:</strong> <span id="onama"></span></p>
    <p><strong>Gender:</strong> <span id="ogender"></span></p>
    <p><strong>Agama:</strong> <span id="oagama"></span></p>
    <p><strong>Status:</strong> <span id="ostatus"></span></p>
    <p><strong>Jurusan:</strong> <span id="ojurusan"></span></p>
    <p><strong>Komentar:</strong> <span id="oket"></span></p>
  </div>

  <!-- JavaScript -->
  <script>
    // Saat tombol "Kirim" diklik
    document.getElementById('kirimBtn').addEventListener('click', () => {
      
      // Fungsi singkat untuk ambil nilai dari input berdasarkan id
      const getVal = id => document.getElementById(id).value;

      // Tampilkan nilai input ke elemen span output
      document.getElementById('onik').textContent = getVal('Nik');
      document.getElementById('onama').textContent = getVal('Nama');
      document.getElementById('ogender').textContent = getVal('Gender');
      document.getElementById('oagama').textContent = getVal('Agama');
      document.getElementById('ojurusan').textContent = getVal('Jurusan');
      document.getElementById('oket').textContent = getVal('Ket');

      // Cek status yang dipilih (radio button)
      const status = document.querySelector('input[name="status"]:checked');
      document.getElementById('ostatus').textContent = status ? status.value : 'Belum dipilih';
    });
  </script>
</body>
</html>
