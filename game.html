<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Capybara Runner</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  
  <!-- Layar Awal -->
  <div id="startScreen">
    <h1>Capybara Jump!</h1>
    <input type="text" id="playerName" placeholder="Masukkan nama kamu" />
    <br />
    <button id="startBtn">START</button>
  </div>

  <!-- Canvas Game -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- UI Skor dan Kontrol -->
  <div id="gameUI">
    <div id="scoreDisplay">Score: 0</div>
    <button id="pauseBtn">⏸️ Jeda</button>
    <button id="resumeBtn">▶️ Lanjut</button>
    <button id="restartBtn">🔄 Ulang</button>

    <label><input type="checkbox" id="soundToggle" checked> 🔊 Suara</label>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen">
    <h1>Game Over!</h1>
    <p>Skor Anda: <span id="finalScore">0</span></p>
    <h2>🏆 Papan Skor 🏆</h2>
    <ul id="scoreList"></ul>
    <button onclick="location.reload()">Main Lagi</button>
  </div>

  

  <script src="game.js"></script>
  
</body>
</html>
