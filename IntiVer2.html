<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capybara Jump - Game</title>
  <link rel="stylesheet" href="IntiVer2.css" />
</head>
<body>
  <!-- Efek visual tema -->
  <div id="visual-effects"></div>

  <!-- Kontainer Game -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD: Info Pemain, Skor, Waktu -->
    <div id="hud">
      <span id="playerNameDisplay">Pemain: -</span>
      <span id="point">Poin: 0</span>
      <span id="score">Skor: 0</span>
      <span id="time">Waktu: 0</span>
    </div>

    <!-- Kontrol: Pause, Lanjut, Ulang -->
    <div id="controls">
      <button id="pauseBtn" class="control-btn">⏸</button>
      <button id="resumeBtn" class="control-btn" style="display: none;">▶️</button>
      <button id="restartBtn" class="control-btn">🔄</button>
    </div>
  </div>

  <!-- Modal Game Over -->
  <div id="gameOverBox" class="hidden">
    <div class="modal">
      <h2>GAME OVER</h2>
      <p><strong>Poin:</strong> <span id="pointResult">0</span></p>
      <p><strong>Skor:</strong> <span id="scoreResult">0</span></p>
      <p><strong>Waktu:</strong> <span id="timeResult">0</span> detik</p>
      <button onclick="goToLeaderboard()">Leaderboard</button>
      <button onclick="restartGame()">Start Again</button>
    </div>
  </div>

  <!-- Audio -->
  <audio id="bgm" src="MusicGame.mp3" preload="auto"></audio>
  <audio id="jumpSound" src="JumpGame.mp3" preload="auto"></audio>
  <audio id="gameOverSound" src="gameOver.mp3" preload="auto"></audio>

  <!-- JavaScript -->
  <script src="IntiVer2.js"></script>
</body>
</html>
