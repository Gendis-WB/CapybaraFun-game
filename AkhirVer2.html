<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Over - Capybara Jump</title>
  <link rel="stylesheet" href="AkhirVer2.css"/>
</head>
<body>
  <div class="container" id="themeContainer">
    <h1 class="game-over-title">Game Over</h1>
    <p id="finalScore">Skor Akhir: 0</p>
    <p id="finalTime">Waktu: 0 detik</p>

    <h2>Papan Skor</h2>
    <table id="leaderboard">
      <thead>
        <tr>
        <th>🏅</th>
        <th>Pemain</th>
        <th class="highlight">Poin</th>
        <th>Skor</th>
        <th>Waktu (d)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>


    <div class="buttons">
      <button onclick="restartGame()">🔄 Ulangi</button>
      <button onclick="goToHome()">🏠 Menu Awal</button>
    </div>
  </div>

  <audio id="gameOverMusic" loop></audio>
  <script src="AkhirVer2.js"></script>
</body>
</html>
